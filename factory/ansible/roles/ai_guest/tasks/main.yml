---
# Install a guest-side `cyberai` CLI so a Kali clone can talk to the HOST Ollama
# over the AI plane with the same ergonomics as the host CLI: `ai run|list|pull|rm|opencode`.
- name: Install guest cyberai CLI (talks to host Ollama over the AI plane)
  template:
    src: cyberai-guest.sh.j2
    dest: /usr/local/bin/cyberai
    owner: root
    group: root
    mode: "0755"