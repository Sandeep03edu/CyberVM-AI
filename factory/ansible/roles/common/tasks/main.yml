---
# A build cut off mid-upgrade leaves dpkg half-configured, and apt then refuses
# every command until it is repaired. No-op on a healthy image.
- name: Repair an interrupted dpkg run (if any)
  shell:
    cmd: export DEBIAN_FRONTEND=noninteractive; dpkg --force-confdef --force-confold --configure -a && apt-get -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" -f install
  when: not ansible_check_mode

- name: Update apt cache (live output streams to console)
  shell:
    cmd: export DEBIAN_FRONTEND=noninteractive; apt-get update -o Acquire::Retries=3
  when: not ansible_check_mode

- name: Full upgrade (live output streams to console)
  shell:
    cmd: export DEBIAN_FRONTEND=noninteractive; apt-get -y -o Acquire::Retries=3 -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" dist-upgrade
  when: not ansible_check_mode

- name: Base utilities
  apt:
    name: [git, curl, wget, jq, tmux, ripgrep, python3, python3-pip, python3-venv, pipx, ca-certificates, gnupg]
    state: present

- name: Node.js (for AI client CLIs)
  apt: { name: [nodejs, npm], state: present }

# REVERTED (see CHANGELOG/commit history): an attempt to install Guest Additions from the
# host's own /usr/share/virtualbox/VBoxGuestAdditions.iso (to fix a version mismatch that
# breaks `VBoxManage guestcontrol <vm> run --exe /bin/bash` — "cannot execute binary file")
# was tested against a real clone and caused a WORSE regression: the clone's network never
# came up at all (no DHCP lease, confirmed absent from the VBox host-only DHCP lease file)
# and VBoxService itself never became ready (`guestcontrol` reported "guest execution
# service is not ready (yet)" even minutes after the VM reached its graphical login
# screen; VBox.log showed the guest reporting a stale/unexpected Guest Additions version
# 6.0.0, not the 7.2.16 that was actually installed). Reverted to the known-working
# apt-based install rather than risk leaving golden unusable. The original GA-version-vs-
# host mismatch (which only breaks `guestcontrol`-based commands specifically, not general
# VM use) is tracked separately — do not re-attempt the ISO-install approach without first
# capturing /var/log/vboxadd-install.log from inside a test guest to see why VBoxService
# didn't start, and without a known-good rollback snapshot taken before `golden build` runs.
- name: VirtualBox Guest Additions (vboxsf shared folders, guest agent, X11 driver)
  apt:
    name: [linux-headers-amd64, virtualbox-guest-utils, virtualbox-guest-x11]
    state: present

- name: Allow the AI user to read VirtualBox auto-mounted shares (realtime skills share)
  user: { name: "{{ vm_user }}", groups: vboxsf, append: true }

- name: cybervm metadata dir
  file: { path: /etc/cybervm, state: directory, mode: "0755" }

- name: Timezone
  shell: timedatectl set-timezone UTC
