---
# Provisions the CyberVM golden Kali image. Reads manifests from ../../config.
- name: Configure CyberVM Kali golden image
  hosts: golden
  become: true
  vars:
    cybervm_config: "{{ playbook_dir }}/../../../config"
    # host_ai_ip, ai_plane_cidr, ollama_port, rag_port and vm_user are passed in
    # from .cybervm.env by lib/golden.sh (-e). Not defaulted here on purpose: a
    # run without them must fail, not bake a stale address into the image.
  roles:
    - common
    - hardening
    - security_tools
    - burp
    - ai_clients
    - ai_guest
    - rag_client
    - disable_sleep
    - mcp_servers
  post_tasks:
    - name: Write guest manifest
      copy:
        dest: /etc/cybervm/manifest.json
        content: |
          {
            "provisioned": "{{ ansible_date_time.iso8601 }}",
            "kali": "{{ ansible_distribution_release | default('rolling') }}",
            "roles": ["common","hardening","security_tools","burp","ai_clients","ai_guest","rag_client","disable_sleep","mcp_servers"]
          }
        mode: "0644"
