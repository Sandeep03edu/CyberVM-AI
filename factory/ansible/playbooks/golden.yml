---
# Provisions the CyberAI golden Kali image. Reads manifests from ../../config.
- name: Configure CyberAI Kali golden image
  hosts: golden
  become: true
  vars:
    cyberai_config: "{{ playbook_dir }}/../../../config"
    host_ai_ip: "192.168.57.1"
    ollama_port: "11434"
    rag_port: "8088"
    vm_user: "kali"
  roles:
    - common
    - hardening
    - security_tools
    - burp
    - ai_clients
    - ai_guest
    - rag_client
  post_tasks:
    - name: Write guest manifest
      copy:
        dest: /etc/cyberai/manifest.json
        content: |
          {
            "provisioned": "{{ ansible_date_time.iso8601 }}",
            "kali": "{{ ansible_distribution_release | default('rolling') }}",
            "roles": ["common","hardening","security_tools","burp","ai_clients","ai_guest","rag_client"]
          }
        mode: "0644"
