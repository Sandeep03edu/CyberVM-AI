[defaults]
inventory = inventory/golden.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = /usr/bin/python3
[ssh_connection]
pipelining = True
# Fail fast on a dead guest (the previous run hung ~1h on a zombie TCP socket):
ssh_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o TCPKeepAlive=yes -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
