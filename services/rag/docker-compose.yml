# CyberVM RAG stack — bound to the private AI-plane IP only.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "${CYBERVM_HOST_IP}:6333:6333"
    volumes:
      - "${CYBERVM_RAG}/data:/qdrant/storage"

  rag-api:
    build: ./api
    restart: unless-stopped
    depends_on: [qdrant]
    environment:
      QDRANT_URL: "http://qdrant:6333"
      OLLAMA_URL: "http://${CYBERVM_HOST_IP}:${CYBERVM_OLLAMA_PORT}"
      EMBED_MODEL: "nomic-embed-text"
    ports:
      - "${CYBERVM_HOST_IP}:${CYBERVM_RAG_PORT}:8088"

  # one-shot ingester (run via: cybervm rag update)
  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    profiles: ["tools"]
    environment:
      QDRANT_URL: "http://qdrant:6333"
      OLLAMA_URL: "http://${CYBERVM_HOST_IP}:${CYBERVM_OLLAMA_PORT}"
    volumes:
      - "${CYBERVM_RAG}/sources:/sources:ro"
      - "${CYBERVM_RAG}/state:/state"
