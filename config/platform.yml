# ── CyberVM platform pins (single source of truth for versions/checksums) ──
# Bump deliberately; every value here makes builds reproducible.

kali:
  release: "2026.2"
  # Official prebuilt VirtualBox image (.7z contains .vbox + .vdi)
  archive: "kali-linux-2026.2-virtualbox-amd64.7z"
  url: "https://kali.download/base-images/kali-2026.2/kali-linux-2026.2-virtualbox-amd64.7z"
  # VERIFIED 2026-09-20 against https://kali.download/base-images/kali-2026.2/SHA256SUMS
  sha256: "41ed7ec51cdd3a5ca663ec09492261ba81acb26625fdda85ce7acb16909f3cee"

virtualbox:
  min_major: "7.1"
  tested: "7.2.16"

ollama:
  version: "v0.34.2"          # verified latest 2026-09-20
  url: "https://github.com/ollama/ollama/releases/download/v0.34.2/ollama-linux-amd64.tar.zst"
  # sha256: Linux assets moved from .tgz -> .tar.zst; hash from the release's sha256sum.txt (host-setup verifies).
  # Refresh automatically with: cybervm host ollama-pin
  sha256: "e155b83589986d2c581fdbf1381ea3ebdb16549883679cd5a0627f7cdc05b12b"

vm_names:
  base:   "CyberVM-Kali-Base"
  golden: "CyberVM-Kali-Golden"
  clone_prefix: ""

# Shared host-side VM features, applied automatically by every code path that
# authors a VM's config (base import, golden build, clone) — see lib/common.sh
# vm_apply_host_config. Never hardcode these flags in lib/*.sh.
#
# SECURITY: these are HYPERVISOR properties stored in the .vbox, not guest
# settings. "bidirectional" opens a host<->guest data channel, so it deliberately
# overrides the zero-trust sandbox posture in docs/runbook/00-master-plan.md.
# To re-tighten, set both to "disabled" here and re-run the commands below.
#
# NOTE: VirtualBox copies these into a VM only at CLONE time. Changing them here
# does not retroactively fix already-created clones — re-create them.
vm_defaults:
  clipboard_mode:   "bidirectional"   # disabled | hosttoguest | guesttohost | bidirectional
  draganddrop_mode: "bidirectional"   # disabled | hosttoguest | guesttohost | bidirectional

snapshots:
  base:   "base-clean"
  golden: "golden"           # actual tag becomes golden-<YYYY.MM.DD>

# Per-clone CPU/memory. Applied ONLY at `cybervm new` time (and by
# `cybervm resize`) — these are .vbox properties, so the golden image is never
# modified and one golden serves every clone.
#
# RAM:vCPU is a uniform 1:2 ratio across all profiles, and it is also the rule
# `cybervm new --ram <GB>` derives from when --cpus is omitted. Keeping the two
# identical means `--ram 12` and `--profile balanced` agree; if they diverged,
# the same request would silently produce two different machines.
#
# Sizing is bounded by the HOST, not the guest — see the RAM guard in lib/vm.sh
# (CYBERVM_HOST_RESERVE_MB, .cybervm.env). With a 6144MB reserve the host's
# usable budget is roughly (MemTotal - 6144), so:
#   lean 8192x2  -> up to 3 concurrent    balanced 12288x2 -> 2 concurrent
#   large 16384  -> 1 concurrent only
# Ollama runs on the HOST (the VM reaches it over NIC2), so no guest RAM is ever
# spent on local LLMs and these numbers can be raised freely.
resource_profiles:
  lean:     { ram_mb: 8192,  cpus: 4 }   # 2-3 concurrent, cloud agents only
  balanced: { ram_mb: 12288, cpus: 6 }   # DEFAULT - 1 VM comfortably, 2 if light
  large:    { ram_mb: 16384, cpus: 8 }   # 1 VM at a time
default_profile: "balanced"
