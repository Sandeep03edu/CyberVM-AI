# Burp extensions to auto-install (burp role). PIN + VERIFY everything:
# third-party extensions run arbitrary code inside Burp.
#
# BApp .jar/.py files are fetched during a NAT build, sha256-checked, and dropped
# into ~/.BurpSuite/bapps/, then registered in UserConfigCommunity.json.
#
# Each BApp is pinned to a fixed version via its PortSwigger `serial` (the download
# URL is .../bapps/download/<uuid>/<serial>). `sha256` is the integrity hash of the
# bytes at that serial. Keep this lock current with:
#   ./cybervm pins check     # detects serial drift vs the live store (no download)
#   ./cybervm pins refresh   # re-pins any drifted serial + sha256
# golden build/verify abort instantly if pins are stale.
#
# NOTE: url + sha256 are populated before golden build. Some BApps (Turbo Intruder)
# ship as a zip archive containing the actual entry-point file.
jython:
  url: "https://repo1.maven.org/maven2/org/python/jython-standalone/2.7.3/jython-standalone-2.7.3.jar"
  sha256: "da7f3d829b148bcfa86b059dc964e3a8556fedb021096c8db07e30c66faab9b4"
  dest: "/opt/burp/jython-standalone-2.7.3.jar"
