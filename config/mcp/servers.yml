# ── MCP servers baked into the golden image ────────────────────────────────
# Installed by the mcp_servers role, then wired into claude / codex / opencode.
#
# Mirrors config/ai/clients.yml convention: `version: "latest"` here, pinned to
# an exact version deliberately before release builds. Each clone inherits the
# baked browser through linked-clone copy-on-write, so a clone is usable with no
# network at all; `cybervm mcp update` inside a clone refreshes to the newest
# release on demand (needs net mode nat|bridged).
#
# The `playwright` server is a MATCHED PAIR: @playwright/mcp pins a `playwright`
# version, which in turn pins an exact Chromium build. The version recorded in
# /etc/cybervm/mcp.lock is therefore the real reproducibility anchor, not this
# file — check it with `cybervm mcp status` inside a clone.
#
# Bump with: edit `version` below, then re-provision golden
# (`./cybervm golden build`) and re-create clones. `bake` is a no-op once a
# clone already has /opt/ms-playwright/.cybervm-baked, so use
# `sudo cybervm-mcp-install bake --force` to force a re-bake.
servers:
  - name: playwright
    transport: stdio
    package: "@playwright/mcp"
    bin: "playwright-mcp"            # npm bin exposed by @playwright/mcp
    version: "latest"                # "latest" or an exact semver
    command: "/usr/local/bin/cybervm-playwright-mcp"   # baked launcher (wrapper)
    args: ["--isolated"]             # in-memory profile -> claude+codex+opencode in parallel
    browsers_path: "/opt/ms-playwright"
    install_browser: chromium
    install_no_shell: true           # headed-only: skip the separate headless-shell build
    headed: true                     # never --headless: the browser window is always visible

  # ── rea-dast-plugin's bundled playwright-attacker/-victim (AgenticPlugins share) ──
  # `bundled: true` = this command already exists on disk, owned by the plugin,
  # reached via the AgenticPlugins vboxsf share (CYBERVM_PLUGINS_HOST in
  # .cybervm.env). It is EXCLUDED from the install-plan/bake step and from the
  # generic wrapper-file templating (see mcp-install.plan.j2 and
  # roles/mcp_servers/tasks/main.yml) — Ansible only needs to REGISTER these two
  # with `claude mcp add` and list them in opencode.json, both of which the
  # existing mcp_local loops already do generically. The wrapper script itself
  # launches a proxied, CDP-attachable Chrome on first use and execs `npx -y
  # @playwright/mcp` (version pinned via REA_DAST_PLAYWRIGHT_MCP_VERSION inside
  # the script, default "latest") — so first real use needs network.
  #
  # `default_enabled: false` — a stdio MCP server is spawned eagerly at client
  # startup (it has to run to report its tool list), so having these registered
  # unconditionally meant a plain `claude`/`opencode` launched TWO Chrome windows
  # every single time, for any session, not just DAST work. Claude Code has no
  # enable/disable toggle for a registered user-scope server (`claude mcp --help`
  # only has add/remove/get/list — no enable/disable), so the only way to make
  # this off-by-default is to not `claude mcp add` it at golden-build time at
  # all (see the `when:` guard in mcp_servers/tasks/main.yml) and not render it
  # `enabled: true` in opencode.json (see opencode.json.j2). Turn it on/off per
  # clone, for the session you actually want it, with the guest-side
  # `cybervm mcp dast-roster on|off|status` command.
  - name: playwright-attacker
    transport: stdio
    bundled: true
    default_enabled: false
    command: "/media/sf_AgenticPlugins/rea-dast-plugin/scripts/launch_and_attach.sh"
    args: ["attacker", "9222"]
  - name: playwright-victim
    transport: stdio
    bundled: true
    default_enabled: false
    command: "/media/sf_AgenticPlugins/rea-dast-plugin/scripts/launch_and_attach.sh"
    args: ["victim", "9223"]
