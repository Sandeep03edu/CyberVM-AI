# Endpoints ONLY. No API keys here (keys live in ~/.config/cybervm/secrets.env).
# ${CYBERVM_*} values are defined in .cybervm.env — the address is not repeated here.
local:
  ollama:
    base_url: "http://${CYBERVM_HOST_IP}:${CYBERVM_OLLAMA_PORT}/v1"   # OpenAI-compatible
cloud:
  anthropic:  { env: "ANTHROPIC_API_KEY" }
  openai:     { env: "OPENAI_API_KEY" }
  deepseek:   { env: "DEEPSEEK_API_KEY",  base_url: "https://api.deepseek.com" }
  openrouter: { env: "OPENROUTER_API_KEY", base_url: "https://openrouter.ai/api/v1" }
rag:
  base_url: "http://${CYBERVM_HOST_IP}:${CYBERVM_RAG_PORT}"
  mcp_url:  "http://${CYBERVM_HOST_IP}:${CYBERVM_RAG_PORT}/mcp"
